name: Deploy Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinaadmin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
      CINAADMIN_ORIGIN: https://admin.cinaseek.ai
      CINAUTH_REQUEST_ORIGIN: https://admin.cinaseek.ai
      CINAUTH_BASE_URL: https://auth.cinaseek.ai
      NEXT_PUBLIC_CINAUTH_BASE_URL: https://auth.cinaseek.ai
      CINAUTH_AUTH_URL: https://demo-auth.cinagroup.com
      NEXT_PUBLIC_CINAUTH_AUTH_URL: https://demo-auth.cinagroup.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy
        run: pnpm deploy
